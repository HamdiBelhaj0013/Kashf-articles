<style>
#qt1-scene{width:100%;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:transparent;position:relative;gap:14px;}
#qt1-text{direction:rtl;font-family:'Amiri',Georgia,serif;font-size:24px;line-height:2.4;text-align:center;max-width:680px;color:#000000;position:relative;}
#qt1-source{direction:rtl;font-family:'Amiri',Georgia,serif;font-size:15px;color:#8a8378;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 0.6s ease,transform 0.6s ease;}
#qt1-source.on{opacity:1;transform:translateY(0);}
#qt1-source::before{content:"— ";}
@media(max-width:600px){#qt1-text{font-size:19px;line-height:2.2;} #qt1-source{font-size:13px;}}
.qt1-w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(5px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1),filter 0.55s cubic-bezier(0.22,1,0.36,1);color:#000000;font-weight:400;white-space:nowrap;text-decoration:none;}
.qt1-w.on{opacity:1;transform:translateY(0);filter:blur(0);}
.qt1-k{color:#B27955;font-weight:700;}
.qt1-k.on{animation:qt1-pop 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes qt1-pop{0%{opacity:0;transform:translateY(14px) scale(0.88);filter:blur(6px);color:#d9ac8c;}60%{opacity:1;transform:translateY(-4px) scale(1.07);filter:blur(0);color:#B27955;}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:#B27955;}}
.qt1-sp{display:inline-block;width:0.3em;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<div id="qt1-scene">
  <div id="qt1-text"></div>
  <div id="qt1-source">أستاذ فلسفة وفلاح بيولوجي</div>
</div>

<script>
(function(){
  var W=[
    {t:"إنتاج",k:false},{t:"الخضر",k:false},{t:"والغلال",k:false},{t:"دون",k:true},
    {t:"مبيدات",k:true},{t:"كيميائية",k:true},{t:"أمر",k:false},{t:"ممكن",k:true}
  ];

  var box=document.getElementById("qt1-text");
  var scene=document.getElementById("qt1-scene");
  var source=document.getElementById("qt1-source");
  var played=false;

  function play(){
    if(played)return;
    played=true;
    W.forEach(function(w,i){
      var s=document.createElement("span");
      s.className=w.k?"qt1-w qt1-k":"qt1-w";
      s.textContent=w.t;
      box.appendChild(s);
      if(i<W.length-1){var sp=document.createElement("span");sp.className="qt1-sp";box.appendChild(sp);}
    });
    var els=box.querySelectorAll(".qt1-w");
    els.forEach(function(el,i){
      setTimeout(function(){el.classList.add("on");},i*160+80);
    });
    setTimeout(function(){source.classList.add("on");},els.length*160+400);
  }

  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){play();io.disconnect();}
    },{threshold:0.2,rootMargin:"0px 0px -60px 0px"});
    io.observe(scene);
  } else {
    play();
  }
})();
</script>
