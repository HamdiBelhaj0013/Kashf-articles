<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>فجوة التشغيل — بطاقات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    #gg-widget *, #gg-widget *::before, #gg-widget *::after { box-sizing: border-box; margin: 0; padding: 0; }

    #gg-widget {
      --w:         #D4537E;
      --w-dim:     #FBEAF0;
      --m:         #185FA5;
      --m-dim:     #E6F1FB;
      --gap-bg:    #FEF3E2;
      --gap-text:  #9A5A00;
      --border:    #e8e8e8;
      --text-1:    #1a1a1a;
      --text-2:    #6b6b6b;
      --text-3:    #b0b0b0;
      --radius:    16px;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans Arabic', sans-serif;

      font-family: var(--sans);
      background: transparent;
      direction: rtl;
    }

    /* ── GRID ── */
    #gg-widget .gg-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0;
    }

    /* ── CARD SHELL ── */
    #gg-widget .gg-fc {
      perspective: 1200px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      height: 280px;
      user-select: none;
    }

    #gg-widget .gg-fc-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .7s cubic-bezier(.4,.2,.2,1);
      border-radius: var(--radius);
    }

    #gg-widget .gg-fc.flipped .gg-fc-inner {
      transform: rotateY(180deg);
    }

    /* ── FACES ── */
    #gg-widget .gg-fc-front,
    #gg-widget .gg-fc-back {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    }

    #gg-widget .gg-fc-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 18px 20px;
    }

    #gg-widget .gg-fc-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 14px 16px;
      background: #fafafa;
    }

    /* ── FRONT ── */
    #gg-widget .gg-fc-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #gg-widget .gg-fc-icon svg { width: 20px; height: 20px; }
    #gg-widget .gg-icon-employ { background: #FBEAF0; }
    #gg-widget .gg-icon-unemp  { background: #FEF3E2; }
    #gg-widget .gg-icon-grad   { background: #EAF7F0; }

    #gg-widget .gg-fc-front-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex: 1;
      justify-content: center;
    }

    #gg-widget .gg-fc-big-num {
      font-family: var(--mono);
      font-size: clamp(38px, 5.5vw, 46px);
      font-weight: 600;
      line-height: 1;
      color: var(--w);
    }
    #gg-widget .gg-fc-big-pct { font-size: 18px; font-weight: 300; }

    #gg-widget .gg-fc-label {
      font-size: 11px;
      color: var(--text-2);
      text-align: center;
      line-height: 1.55;
    }

    #gg-widget .gg-fc-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-3);
    }
    #gg-widget .gg-hint-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-3);
      animation: gg-blink 2.4s ease infinite;
      flex-shrink: 0;
    }
    @keyframes gg-blink {
      0%,100% { opacity:.25; } 50% { opacity:1; }
    }

    /* ── BACK ── */
    #gg-widget .gg-fc-back-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
      letter-spacing: .03em;
    }

    #gg-widget .gg-sil-pair {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      flex: 1;
      padding: 4px 0;
    }

    #gg-widget .gg-sil-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #gg-widget .gg-sil-fig {
      width: 52px;
      height: 116px;
      flex-shrink: 0;
    }
    #gg-widget .gg-sil-fig svg { width: 100%; height: 100%; display: block; }

    #gg-widget .gg-sil-num {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }
    #gg-widget .gg-sil-lbl {
      font-size: 9px;
      color: var(--text-2);
      font-weight: 500;
    }

    #gg-widget .gg-gap-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      background: var(--gap-bg);
      color: var(--gap-text);
      white-space: nowrap;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 540px) {
      #gg-widget .gg-cards-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      #gg-widget .gg-fc { height: 240px; }
      #gg-widget .gg-fc-front { flex-direction: row; flex-wrap: wrap; padding: 18px 20px 16px; }
      #gg-widget .gg-fc-front-body { flex-direction: row; gap: 16px; flex: 1; align-items: center; justify-content: flex-start; padding-right: 10px; }
      #gg-widget .gg-fc-big-num { font-size: 38px; }
      #gg-widget .gg-fc-label { text-align: right; }
      #gg-widget .gg-fc-hint { width: 100%; justify-content: flex-start; }
      #gg-widget .gg-sil-fig { width: 44px; height: 96px; }
      #gg-widget .gg-sil-pair { gap: 16px; }
    }
  </style>
</head>

<script>
(function () {

  const WOMAN_BOTTOM = 85;
  const MAN_BOTTOM   = 92;
  const VH           = 116;

  function animPct(el, target, dur, delay) {
    setTimeout(() => {
      const s = performance.now();
      const isInt = target % 1 === 0;
      (function tick(now) {
        const p = Math.min((now - s) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = isInt
          ? Math.round(e * target) + '%'
          : (e * target).toFixed(1) + '%';
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target + '%';
      })(s);
    }, delay || 0);
  }

  document.querySelectorAll('#gg-widget .gg-fc').forEach(card => {
    let animated = false;

    card.addEventListener('click', () => {
      card.classList.toggle('flipped');

      if (card.classList.contains('flipped') && !animated) {
        animated = true;

        const fills = card.querySelectorAll('.gg-fc-back .sil-fill');
        const nums  = card.querySelectorAll('.gg-fc-back .gg-sil-num');

        const wVal = parseFloat(nums[0] && nums[0].getAttribute('data-val'));
        const mVal = parseFloat(nums[1] && nums[1].getAttribute('data-val'));

        const wH = Math.round(VH * (wVal / 100));
        const mH = Math.round(VH * (mVal / 100));

        /* trigger halfway through flip so back is starting to face the user */
        setTimeout(() => {
          if (fills[0]) {
            fills[0].setAttribute('y',      WOMAN_BOTTOM - wH);
            fills[0].setAttribute('height', wH);
          }
          if (fills[1]) {
            fills[1].setAttribute('y',      MAN_BOTTOM - mH);
            fills[1].setAttribute('height', mH);
          }
          if (nums[0]) animPct(nums[0], wVal, 1200, 0);
          if (nums[1]) animPct(nums[1], mVal, 1200, 150);
        }, 350);
      }
    });
  });

})();
</script>
