<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
.gjc.qp3-root{--qp3-acc:#96A32E;--qp3-ink:#66711A;--qp3-soft:rgba(150,163,46,.26);--qp3-text:#1F1B16;--qp3-muted:#6B6258;--qp3-bg:#FBF7F1;--qp3-step:75ms;--qp3-base:350ms;--qp3-end:1700ms;direction:rtl;text-align:right;max-width:780px;margin:40px auto;padding:0 16px;box-sizing:border-box;font-family:'Almarai',sans-serif}
.gjc.qp3-root *{box-sizing:border-box}
.gjc.qp3-root .qp3-card{position:relative;margin:0;padding:clamp(44px,7.5vw,68px) 0 0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.gjc.qp3-root .qp3-card::before,.gjc.qp3-root .qp3-card::after,.gjc.qp3-root .qp3-text::before,.gjc.qp3-root .qp3-text::after{content:'';display:none !important}
.gjc.qp3-root .qp3-mark{position:absolute;top:0;left:0;width:clamp(54px,9vw,84px);height:auto;fill:var(--qp3-acc);opacity:0;transform:scale(.4) rotate(-14deg);transform-origin:center;transition:opacity .6s ease,transform .8s cubic-bezier(.2,1.4,.4,1)}
.gjc.qp3-root .qp3-text{position:relative;margin:0;padding:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,3.5vw,31px);line-height:1.95;color:var(--qp3-text);quotes:none;border:0;background:none}
.gjc.qp3-root .qp3-w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);transition:opacity .55s ease,filter .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--qp3-i) * var(--qp3-step) + var(--qp3-base))}
.gjc.qp3-root .qp3-hl{color:var(--qp3-ink);background-image:linear-gradient(var(--qp3-soft),var(--qp3-soft));background-repeat:no-repeat;background-position:100% 88%;background-size:0% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:3px;transition:background-size .9s cubic-bezier(.6,0,.2,1) var(--qp3-end)}
.gjc.qp3-root .qp3-cap{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:clamp(18px,3vw,26px);opacity:0;transform:translateY(8px);transition:opacity .6s ease calc(var(--qp3-end) + 200ms),transform .6s ease calc(var(--qp3-end) + 200ms)}
.gjc.qp3-root .qp3-line{display:block;height:2px;width:0;background:var(--qp3-acc);transition:width .7s ease calc(var(--qp3-end) + 250ms)}
.gjc.qp3-root .qp3-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--qp3-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1}
.gjc.qp3-root .qp3-who{display:flex;flex-direction:column;align-items:flex-end;text-align:left;line-height:1.35}
.gjc.qp3-root .qp3-name{font-weight:800;font-size:16px;color:var(--qp3-text)}
.gjc.qp3-root .qp3-role{font-weight:400;font-size:14px;color:var(--qp3-muted)}
.gjc.qp3-root.qp3-in .qp3-mark{opacity:.16;transform:scale(1) rotate(0)}
.gjc.qp3-root.qp3-in .qp3-w{opacity:1;filter:blur(0);transform:none}
.gjc.qp3-root.qp3-in .qp3-hl{background-size:100% 42%}
.gjc.qp3-root.qp3-in .qp3-cap{opacity:1;transform:none}
.gjc.qp3-root.qp3-in .qp3-line{width:clamp(28px,6vw,56px)}
@media (max-width:480px){.gjc.qp3-root{margin:28px auto}.gjc.qp3-root .qp3-av{width:36px;height:36px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.gjc.qp3-root *{transition:none !important}.gjc.qp3-root .qp3-w{opacity:1;filter:none;transform:none}.gjc.qp3-root .qp3-hl{background-size:100% 42%}.gjc.qp3-root .qp3-cap{opacity:1;transform:none}.gjc.qp3-root .qp3-line{width:40px}.gjc.qp3-root .qp3-mark{opacity:.16;transform:none}}
</style>
<div class="gjc qp3-root" id="qp3-root" dir="rtl" lang="ar">
  <div class="qp3-card" role="figure" aria-label="اقتباس — نسرين بالحاج">
    <svg class="qp3-mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M0 48V28C0 12 8 3 24 0l3 6C18 9 14 15 14 22h10v26H0zm36 0V28c0-16 8-25 24-28l3 6c-9 3-13 9-13 16h10v26H36z"/></svg>
    <p class="qp3-text"><span class="qp3-w" style="--qp3-i:0">التقيت</span> <span class="qp3-w" style="--qp3-i:1">بوئام</span> <span class="qp3-hl"><span class="qp3-w" style="--qp3-i:2">صدفة</span></span> <span class="qp3-w" style="--qp3-i:3">في</span> <span class="qp3-w" style="--qp3-i:4">أحد</span> <span class="qp3-w" style="--qp3-i:5">اجتماعات</span> <span class="qp3-w" style="--qp3-i:6">مندوبية</span> <span class="qp3-w" style="--qp3-i:7">الفلاحة،</span> <span class="qp3-w" style="--qp3-i:8">ومن</span> <span class="qp3-w" style="--qp3-i:9">هناك</span> <span class="qp3-hl"><span class="qp3-w" style="--qp3-i:10">بدأت</span> <span class="qp3-w" style="--qp3-i:11">الحكاية.</span></span></p>
    <div class="qp3-cap">
      <span class="qp3-who"><span class="qp3-name">نسرين بالحاج</span><span class="qp3-role">فلاحة شابة</span></span>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.getElementById('qp3-root');
  if(!r){return;}
  var go=function(){r.classList.add('qp3-in');};
  if(!('IntersectionObserver' in window)){go();return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go();io.disconnect();}});},{threshold:0.35});
  io.observe(r);
})();
</script>
