<style>
.gjc.qp1-root{--qp1-acc:#E8650A;--qp1-ink:#B9500A;--qp1-soft:rgba(232,101,10,.20);--qp1-text:#1F1B16;--qp1-muted:#6B6258;--qp1-bg:#FBF7F1;--qp1-step:75ms;--qp1-base:350ms;--qp1-end:2300ms;direction:rtl;text-align:right;max-width:780px;margin:40px auto;padding:0 16px;box-sizing:border-box;font-family:'Almarai',sans-serif}
.gjc.qp1-root *{box-sizing:border-box}
.gjc.qp1-root .qp1-card{position:relative;margin:0;padding:clamp(44px,7.5vw,68px) 0 0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.gjc.qp1-root .qp1-card::before,.gjc.qp1-root .qp1-card::after,.gjc.qp1-root .qp1-text::before,.gjc.qp1-root .qp1-text::after{content:'';display:none !important}
.gjc.qp1-root .qp1-mark{position:absolute;top:0;left:0;width:clamp(54px,9vw,84px);height:auto;fill:var(--qp1-acc);opacity:0;transform:scale(.4) rotate(-14deg);transform-origin:center;transition:opacity .6s ease,transform .8s cubic-bezier(.2,1.4,.4,1)}
.gjc.qp1-root .qp1-text{position:relative;margin:0;padding:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,3.5vw,31px);line-height:1.95;color:var(--qp1-text);quotes:none;border:0;background:none}
.gjc.qp1-root .qp1-w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);transition:opacity .55s ease,filter .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--qp1-i) * var(--qp1-step) + var(--qp1-base))}
.gjc.qp1-root .qp1-hl{color:var(--qp1-ink);background-image:linear-gradient(var(--qp1-soft),var(--qp1-soft));background-repeat:no-repeat;background-position:100% 88%;background-size:0% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:3px;transition:background-size .9s cubic-bezier(.6,0,.2,1) var(--qp1-end)}
.gjc.qp1-root .qp1-cap{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:clamp(18px,3vw,26px);opacity:0;transform:translateY(8px);transition:opacity .6s ease calc(var(--qp1-end) + 200ms),transform .6s ease calc(var(--qp1-end) + 200ms)}
.gjc.qp1-root .qp1-line{display:block;height:2px;width:0;background:var(--qp1-acc);transition:width .7s ease calc(var(--qp1-end) + 250ms)}
.gjc.qp1-root .qp1-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--qp1-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1}
.gjc.qp1-root .qp1-who{display:flex;flex-direction:column;align-items:flex-end;text-align:left;line-height:1.35}
.gjc.qp1-root .qp1-name{font-weight:800;font-size:16px;color:var(--qp1-text)}
.gjc.qp1-root .qp1-role{font-weight:400;font-size:14px;color:var(--qp1-muted)}
.gjc.qp1-root.qp1-in .qp1-mark{opacity:.16;transform:scale(1) rotate(0)}
.gjc.qp1-root.qp1-in .qp1-w{opacity:1;filter:blur(0);transform:none}
.gjc.qp1-root.qp1-in .qp1-hl{background-size:100% 42%}
.gjc.qp1-root.qp1-in .qp1-cap{opacity:1;transform:none}
.gjc.qp1-root.qp1-in .qp1-line{width:clamp(28px,6vw,56px)}
@media (max-width:480px){.gjc.qp1-root{margin:28px auto}.gjc.qp1-root .qp1-av{width:36px;height:36px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.gjc.qp1-root *{transition:none !important}.gjc.qp1-root .qp1-w{opacity:1;filter:none;transform:none}.gjc.qp1-root .qp1-hl{background-size:100% 42%}.gjc.qp1-root .qp1-cap{opacity:1;transform:none}.gjc.qp1-root .qp1-line{width:40px}.gjc.qp1-root .qp1-mark{opacity:.16;transform:none}}
</style>
<div class="gjc qp1-root" id="qp1-root" dir="rtl" lang="ar">

    <p class="qp1-text"><span class="qp1-w" style="--qp1-i:0">أرابط</span> <span class="qp1-w" style="--qp1-i:1">بجانبهم</span> <span class="qp1-hl"><span class="qp1-w" style="--qp1-i:2">لساعات</span> <span class="qp1-w" style="--qp1-i:3">لا</span> <span class="qp1-w" style="--qp1-i:4">تنتهي،</span></span> <span class="qp1-w" style="--qp1-i:5">يومي</span> <span class="qp1-w" style="--qp1-i:6">يبدأ</span> <span class="qp1-w" style="--qp1-i:7">منذ</span> <span class="qp1-w" style="--qp1-i:8">حوالي</span> <span class="qp1-hl"><span class="qp1-w" style="--qp1-i:9">الرابعة</span> <span class="qp1-w" style="--qp1-i:10">صباحا</span></span> <span class="qp1-w" style="--qp1-i:11">ولا</span> <span class="qp1-w" style="--qp1-i:12">ينتهي</span> <span class="qp1-w" style="--qp1-i:13">إلا</span> <span class="qp1-w" style="--qp1-i:14">في</span> <span class="qp1-w" style="--qp1-i:15">آخر</span> <span class="qp1-w" style="--qp1-i:16">النهار</span> <span class="qp1-w" style="--qp1-i:17">فهم</span> <span class="qp1-w" style="--qp1-i:18">ببساطة</span> <span class="qp1-hl"><span class="qp1-w" style="--qp1-i:19">أطفالي</span></span></p>
    <div class="qp1-cap">
      <span class="qp1-who"><span class="qp1-name">وئام الزيادي</span><span class="qp1-role">فلاحة شابة</span></span>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.getElementById('qp1-root');
  if(!r){return;}
  var go=function(){r.classList.add('qp1-in');};
  if(!('IntersectionObserver' in window)){go();return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go();io.disconnect();}});},{threshold:0.35});
  io.observe(r);
})();
</script>
