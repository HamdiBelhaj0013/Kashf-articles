<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
.gjc.qp2-root{--qp2-acc:#E8650A;--qp2-ink:#B9500A;--qp2-soft:rgba(232,101,10,.20);--qp2-text:#1F1B16;--qp2-muted:#6B6258;--qp2-bg:#FBF7F1;--qp2-step:75ms;--qp2-base:350ms;--qp2-end:1550ms;direction:rtl;text-align:right;max-width:780px;margin:40px auto;padding:0 16px;box-sizing:border-box;font-family:'Almarai',sans-serif}
.gjc.qp2-root *{box-sizing:border-box}
.gjc.qp2-root .qp2-card{position:relative;margin:0;padding:clamp(44px,7.5vw,68px) 0 0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.gjc.qp2-root .qp2-card::before,.gjc.qp2-root .qp2-card::after,.gjc.qp2-root .qp2-text::before,.gjc.qp2-root .qp2-text::after{content:'';display:none !important}
.gjc.qp2-root .qp2-mark{position:absolute;top:0;left:0;width:clamp(54px,9vw,84px);height:auto;fill:var(--qp2-acc);opacity:0;transform:scale(.4) rotate(-14deg);transform-origin:center;transition:opacity .6s ease,transform .8s cubic-bezier(.2,1.4,.4,1)}
.gjc.qp2-root .qp2-text{position:relative;margin:0;padding:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,3.5vw,31px);line-height:1.95;color:var(--qp2-text);quotes:none;border:0;background:none}
.gjc.qp2-root .qp2-w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);transition:opacity .55s ease,filter .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--qp2-i) * var(--qp2-step) + var(--qp2-base))}
.gjc.qp2-root .qp2-hl{color:var(--qp2-ink);background-image:linear-gradient(var(--qp2-soft),var(--qp2-soft));background-repeat:no-repeat;background-position:100% 88%;background-size:0% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:3px;transition:background-size .9s cubic-bezier(.6,0,.2,1) var(--qp2-end)}
.gjc.qp2-root .qp2-cap{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:clamp(18px,3vw,26px);opacity:0;transform:translateY(8px);transition:opacity .6s ease calc(var(--qp2-end) + 200ms),transform .6s ease calc(var(--qp2-end) + 200ms)}
.gjc.qp2-root .qp2-line{display:block;height:2px;width:0;background:var(--qp2-acc);transition:width .7s ease calc(var(--qp2-end) + 250ms)}
.gjc.qp2-root .qp2-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--qp2-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1}
.gjc.qp2-root .qp2-who{display:flex;flex-direction:column;align-items:flex-end;text-align:left;line-height:1.35}
.gjc.qp2-root .qp2-name{font-weight:800;font-size:16px;color:var(--qp2-text)}
.gjc.qp2-root .qp2-role{font-weight:400;font-size:14px;color:var(--qp2-muted)}
.gjc.qp2-root.qp2-in .qp2-mark{opacity:.16;transform:scale(1) rotate(0)}
.gjc.qp2-root.qp2-in .qp2-w{opacity:1;filter:blur(0);transform:none}
.gjc.qp2-root.qp2-in .qp2-hl{background-size:100% 42%}
.gjc.qp2-root.qp2-in .qp2-cap{opacity:1;transform:none}
.gjc.qp2-root.qp2-in .qp2-line{width:clamp(28px,6vw,56px)}
@media (max-width:480px){.gjc.qp2-root{margin:28px auto}.gjc.qp2-root .qp2-av{width:36px;height:36px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.gjc.qp2-root *{transition:none !important}.gjc.qp2-root .qp2-w{opacity:1;filter:none;transform:none}.gjc.qp2-root .qp2-hl{background-size:100% 42%}.gjc.qp2-root .qp2-cap{opacity:1;transform:none}.gjc.qp2-root .qp2-line{width:40px}.gjc.qp2-root .qp2-mark{opacity:.16;transform:none}}
</style>
<div class="gjc qp2-root" id="qp2-root" dir="rtl" lang="ar">
  <div class="qp2-card" role="figure" aria-label="اقتباس — وئام الزيادي">
    <svg class="qp2-mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M0 48V28C0 12 8 3 24 0l3 6C18 9 14 15 14 22h10v26H0zm36 0V28c0-16 8-25 24-28l3 6c-9 3-13 9-13 16h10v26H36z"/></svg>
    <p class="qp2-text"><span class="qp2-hl"><span class="qp2-w" style="--qp2-i:0">لم</span> <span class="qp2-w" style="--qp2-i:1">يكن</span> <span class="qp2-w" style="--qp2-i:2">الأمر</span> <span class="qp2-w" style="--qp2-i:3">سهلا،</span></span> <span class="qp2-w" style="--qp2-i:4">لكنني</span> <span class="qp2-hl"><span class="qp2-w" style="--qp2-i:5">لم</span> <span class="qp2-w" style="--qp2-i:6">أفكر</span> <span class="qp2-w" style="--qp2-i:7">يوما</span> <span class="qp2-w" style="--qp2-i:8">في</span> <span class="qp2-w" style="--qp2-i:9">التوقف.</span></span></p>
    <div class="qp2-cap">
      <span class="qp2-who"><span class="qp2-name">وئام الزيادي</span><span class="qp2-role">فلاحة شابة</span></span>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.getElementById('qp2-root');
  if(!r){return;}
  var go=function(){r.classList.add('qp2-in');};
  if(!('IntersectionObserver' in window)){go();return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go();io.disconnect();}});},{threshold:0.35});
  io.observe(r);
})();
</script>
