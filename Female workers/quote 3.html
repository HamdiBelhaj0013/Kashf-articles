<style>
#ajhdt3-scene{width:100%;min-height:260px;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:transparent;position:relative;}
#ajhdt3-text{direction:rtl;font-family:'Amiri',Georgia,serif;font-size:24px;line-height:2.4;text-align:center;max-width:680px;color:#222222;position:relative;}
@media(max-width:600px){#ajhdt3-text{font-size:19px;line-height:2.2;}}
.ajhdt3-w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(5px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1),filter 0.55s cubic-bezier(0.22,1,0.36,1);color:#222222;font-weight:400;white-space:nowrap;text-decoration:none;}
.ajhdt3-w.on{opacity:1;transform:translateY(0);filter:blur(0);}
.ajhdt3-k{color:#E8650A;font-weight:700;}
.ajhdt3-k.on{animation:ajhdt3-pop 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes ajhdt3-pop{0%{opacity:0;transform:translateY(14px) scale(0.88);filter:blur(6px);color:#f5a96a;}60%{opacity:1;transform:translateY(-4px) scale(1.07);filter:blur(0);color:#E8650A;}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:#E8650A;}}
.ajhdt3-sp{display:inline-block;width:0.3em;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<div id="ajhdt3-scene">
  <div id="ajhdt3-text"></div>
</div>

<script>
(function(){
  var W=[
    {t:"رغم",k:false},{t:"رغبتي",k:true},{t:"في",k:false},{t:"إنجاب",k:false},
    {t:"ذلك",k:false},{t:"الطفل",k:false},{t:"ورغم",k:false},{t:"معرفتي",k:false},
    {t:"بالجريمة",k:true},{t:"التي",k:false},{t:"سأرتكبها",k:true},{t:"في",k:false},
    {t:"حقه،",k:false},{t:"لكن",k:false},{t:"قررت",k:true},{t:"بمحض",k:true},
    {t:"إرادتي",k:true},{t:"إجهاضه",k:true},{t:"منذ",k:false},{t:"أن",k:false},
    {t:"علمت",k:false},{t:"بحملي،",k:false},{t:"لذلك",k:false},{t:"سارعت",k:false},
    {t:"إلى",k:false},{t:"إبلاغ",k:false},{t:"مشغلي",k:true},{t:"بوضعي",k:false},
    {t:"الصحي،",k:false},{t:"آملة",k:false},{t:"أن",k:false},{t:"أجد",k:false},
    {t:"تفهّماً",k:false},{t:"ومراعاة،",k:false},{t:"لكن",k:false},{t:"ذلك",k:false},
    {t:"لم",k:false},{t:"يحدث",k:true}
  ];

  var box=document.getElementById("ajhdt3-text");
  var scene=document.getElementById("ajhdt3-scene");
  var played=false;

  function play(){
    if(played)return;
    played=true;
    W.forEach(function(w,i){
      var s=document.createElement("span");
      s.className=w.k?"ajhdt3-w ajhdt3-k":"ajhdt3-w";
      s.textContent=w.t;
      box.appendChild(s);
      if(i<W.length-1){var sp=document.createElement("span");sp.className="ajhdt3-sp";box.appendChild(sp);}
    });
    var els=box.querySelectorAll(".ajhdt3-w");
    els.forEach(function(el,i){
      setTimeout(function(){el.classList.add("on");},i*120+80);
    });
  }

  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){play();io.disconnect();}
    },{threshold:0.2,rootMargin:"0px 0px -60px 0px"});
    io.observe(scene);
  } else {
    play();
  }
})();
</script>
