<style>
#ajhdt4-scene{width:100%;min-height:220px;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:transparent;position:relative;}
#ajhdt4-text{direction:rtl;font-family:'Amiri',Georgia,serif;font-size:24px;line-height:2.4;text-align:center;max-width:680px;color:#222222;position:relative;}
@media(max-width:600px){#ajhdt4-text{font-size:19px;line-height:2.2;}}
.ajhdt4-w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(5px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1),filter 0.55s cubic-bezier(0.22,1,0.36,1);color:#222222;font-weight:400;white-space:nowrap;text-decoration:none;}
.ajhdt4-w.on{opacity:1;transform:translateY(0);filter:blur(0);}
.ajhdt4-k{color:#E8650A;font-weight:700;}
.ajhdt4-k.on{animation:ajhdt4-pop 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes ajhdt4-pop{0%{opacity:0;transform:translateY(14px) scale(0.88);filter:blur(6px);color:#f5a96a;}60%{opacity:1;transform:translateY(-4px) scale(1.07);filter:blur(0);color:#E8650A;}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:#E8650A;}}
.ajhdt4-sp{display:inline-block;width:0.3em;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<div id="ajhdt4-scene">
  <div id="ajhdt4-text"></div>
</div>

<script>
(function(){
  var W=[
    {t:"ذهبت",k:false},{t:"وأنا",k:false},{t:"مرغمة",k:true},{t:"لم",k:false},
    {t:"يكن",k:false},{t:"أمامي",k:false},{t:"خيار",k:true},{t:"آخر",k:false},
    {t:"...",k:false},{t:"وهناك،",k:false},{t:"داخل",k:false},{t:"مقر",k:false},
    {t:"العمل،",k:true},{t:"فقدت",k:true},{t:"طفلي",k:true}
  ];

  var box=document.getElementById("ajhdt4-text");
  var scene=document.getElementById("ajhdt4-scene");
  var played=false;

  function play(){
    if(played)return;
    played=true;
    W.forEach(function(w,i){
      var s=document.createElement("span");
      s.className=w.k?"ajhdt4-w ajhdt4-k":"ajhdt4-w";
      s.textContent=w.t;
      box.appendChild(s);
      if(i<W.length-1){var sp=document.createElement("span");sp.className="ajhdt4-sp";box.appendChild(sp);}
    });
    var els=box.querySelectorAll(".ajhdt4-w");
    els.forEach(function(el,i){
      setTimeout(function(){el.classList.add("on");},i*160+80);
    });
  }

  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){play();io.disconnect();}
    },{threshold:0.2,rootMargin:"0px 0px -60px 0px"});
    io.observe(scene);
  } else {
    play();
  }
})();
</script>
