<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
.gjc.qp5-root{--qp5-acc:#96A32E;--qp5-ink:#66711A;--qp5-soft:rgba(150,163,46,.26);--qp5-text:#1F1B16;--qp5-muted:#6B6258;--qp5-bg:#FBF7F1;--qp5-step:75ms;--qp5-base:350ms;--qp5-end:1475ms;direction:rtl;text-align:right;max-width:780px;margin:40px auto;padding:0 16px;box-sizing:border-box;font-family:'Almarai',sans-serif}
.gjc.qp5-root *{box-sizing:border-box}
.gjc.qp5-root .qp5-card{position:relative;margin:0;padding:clamp(44px,7.5vw,68px) 0 0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.gjc.qp5-root .qp5-card::before,.gjc.qp5-root .qp5-card::after,.gjc.qp5-root .qp5-text::before,.gjc.qp5-root .qp5-text::after{content:'';display:none !important}
.gjc.qp5-root .qp5-mark{position:absolute;top:0;left:0;width:clamp(54px,9vw,84px);height:auto;fill:var(--qp5-acc);opacity:0;transform:scale(.4) rotate(-14deg);transform-origin:center;transition:opacity .6s ease,transform .8s cubic-bezier(.2,1.4,.4,1)}
.gjc.qp5-root .qp5-text{position:relative;margin:0;padding:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,3.5vw,31px);line-height:1.95;color:var(--qp5-text);quotes:none;border:0;background:none}
.gjc.qp5-root .qp5-w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);transition:opacity .55s ease,filter .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--qp5-i) * var(--qp5-step) + var(--qp5-base))}
.gjc.qp5-root .qp5-hl{color:var(--qp5-ink);background-image:linear-gradient(var(--qp5-soft),var(--qp5-soft));background-repeat:no-repeat;background-position:100% 88%;background-size:0% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:3px;transition:background-size .9s cubic-bezier(.6,0,.2,1) var(--qp5-end)}
.gjc.qp5-root .qp5-cap{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:clamp(18px,3vw,26px);opacity:0;transform:translateY(8px);transition:opacity .6s ease calc(var(--qp5-end) + 200ms),transform .6s ease calc(var(--qp5-end) + 200ms)}
.gjc.qp5-root .qp5-line{display:block;height:2px;width:0;background:var(--qp5-acc);transition:width .7s ease calc(var(--qp5-end) + 250ms)}
.gjc.qp5-root .qp5-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--qp5-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1}
.gjc.qp5-root .qp5-who{display:flex;flex-direction:column;align-items:flex-end;text-align:left;line-height:1.35}
.gjc.qp5-root .qp5-name{font-weight:800;font-size:16px;color:var(--qp5-text)}
.gjc.qp5-root .qp5-role{font-weight:400;font-size:14px;color:var(--qp5-muted)}
.gjc.qp5-root.qp5-in .qp5-mark{opacity:.16;transform:scale(1) rotate(0)}
.gjc.qp5-root.qp5-in .qp5-w{opacity:1;filter:blur(0);transform:none}
.gjc.qp5-root.qp5-in .qp5-hl{background-size:100% 42%}
.gjc.qp5-root.qp5-in .qp5-cap{opacity:1;transform:none}
.gjc.qp5-root.qp5-in .qp5-line{width:clamp(28px,6vw,56px)}
@media (max-width:480px){.gjc.qp5-root{margin:28px auto}.gjc.qp5-root .qp5-av{width:36px;height:36px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.gjc.qp5-root *{transition:none !important}.gjc.qp5-root .qp5-w{opacity:1;filter:none;transform:none}.gjc.qp5-root .qp5-hl{background-size:100% 42%}.gjc.qp5-root .qp5-cap{opacity:1;transform:none}.gjc.qp5-root .qp5-line{width:40px}.gjc.qp5-root .qp5-mark{opacity:.16;transform:none}}
</style>
<div class="gjc qp5-root" id="qp5-root" dir="rtl" lang="ar">
  <div class="qp5-card" role="figure" aria-label="اقتباس — نسرين بالحاج">
    <svg class="qp5-mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M0 48V28C0 12 8 3 24 0l3 6C18 9 14 15 14 22h10v26H0zm36 0V28c0-16 8-25 24-28l3 6c-9 3-13 9-13 16h10v26H36z"/></svg>
    <p class="qp5-text"><span class="qp5-hl"><span class="qp5-w" style="--qp5-i:0">أعشق</span> <span class="qp5-w" style="--qp5-i:1">الفلاحة</span></span> <span class="qp5-w" style="--qp5-i:2">منذ</span> <span class="qp5-w" style="--qp5-i:3">صغري</span> <span class="qp5-w" style="--qp5-i:4">فأنا</span> <span class="qp5-hl"><span class="qp5-w" style="--qp5-i:5">إبنة</span> <span class="qp5-w" style="--qp5-i:6">فلاح</span></span> <span class="qp5-hl"><span class="qp5-w" style="--qp5-i:7">وزوجة</span> <span class="qp5-w" style="--qp5-i:8">فلاح</span></span></p>
    <div class="qp5-cap">
      <span class="qp5-who"><span class="qp5-name">نسرين بالحاج</span><span class="qp5-role">فلاحة شابة</span></span>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.getElementById('qp5-root');
  if(!r){return;}
  var go=function(){r.classList.add('qp5-in');};
  if(!('IntersectionObserver' in window)){go();return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go();io.disconnect();}});},{threshold:0.35});
  io.observe(r);
})();
</script>
