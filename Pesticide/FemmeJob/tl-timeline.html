<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
.gjc.tl-root{--tl-accent:#E8650A;--tl-ink:#23262c;--tl-muted:#7a7770;--tl-line:#e6e1d8;--tl-asph:#3b3e45;
  direction:rtl;font-family:'Almarai',Tahoma,sans-serif;color:var(--tl-ink);max-width:720px;margin:0 auto;padding:8px 0;box-sizing:border-box}
.gjc.tl-root *{box-sizing:border-box}
.gjc.tl-root .tl-track{position:relative;padding-right:84px}
.gjc.tl-root .tl-road{position:absolute;top:0;bottom:0;right:14px;width:48px;background:var(--tl-asph);border-radius:24px 24px 0 0}
.gjc.tl-root .tl-road::before{content:'';position:absolute;top:10px;bottom:10px;left:50%;width:0;border-left:3px dashed rgba(255,255,255,.45);transform:translateX(-1.5px)}
.gjc.tl-root .tl-trail{position:absolute;top:0;right:14px;width:48px;height:0;background:linear-gradient(to bottom,rgba(232,101,10,0),rgba(232,101,10,.35));border-radius:24px 24px 0 0;pointer-events:none}
.gjc.tl-root .tl-car{position:absolute;right:23px;top:0;width:30px;height:52px;transform:translateY(-50%);z-index:3;will-change:top}
.gjc.tl-root .tl-item{position:relative;padding:0 0 42px}
.gjc.tl-root .tl-item:last-child{padding-bottom:10px}
.gjc.tl-root .tl-node{position:absolute;right:-62px;top:12px;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #8b8f96;z-index:2;transition:border-color .4s ease,background .4s ease}
.gjc.tl-root .tl-card{border:1px solid var(--tl-line);border-right:4px solid var(--tl-line);background:#fff;padding:14px 16px;transition:border-color .4s ease}
.gjc.tl-root .tl-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gjc.tl-root .tl-year{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(28px,7vw,38px);line-height:1;color:var(--tl-muted);transition:color .4s ease}
.gjc.tl-root .tl-ico{width:30px;height:30px;color:var(--tl-muted);transition:color .4s ease}
.gjc.tl-root .tl-card p{margin:0;font-size:16px;line-height:1.75}
.gjc.tl-root .tl-item.tl-on .tl-node{border-color:var(--tl-accent);background:var(--tl-accent)}
.gjc.tl-root .tl-item.tl-on .tl-card{border-right-color:var(--tl-accent)}
.gjc.tl-root .tl-item.tl-on .tl-year,.gjc.tl-root .tl-item.tl-on .tl-ico{color:var(--tl-accent)}
@media (prefers-reduced-motion:reduce){.gjc.tl-root .tl-node,.gjc.tl-root .tl-card,.gjc.tl-root .tl-year,.gjc.tl-root .tl-ico{transition:none}}
</style>

<div class="gjc tl-root" id="tl-root" dir="rtl">
  <div class="tl-track" id="tl-track">
    <div class="tl-road" aria-hidden="true"></div>
    <div class="tl-trail" id="tl-trail" aria-hidden="true"></div>
    <svg class="tl-car" id="tl-car" viewBox="0 0 30 52" aria-hidden="true">
      <g transform="rotate(180 15 26)">
      <rect x="2" y="2" width="26" height="48" rx="9" fill="#E8650A"/>
      <rect x="6" y="12" width="18" height="10" rx="3" fill="#2b2e34" opacity=".85"/>
      <rect x="6" y="34" width="18" height="7" rx="3" fill="#2b2e34" opacity=".85"/>
      <rect x="10" y="24" width="10" height="7" rx="1.5" fill="#fff"/>
      <rect x="5" y="3" width="5" height="3" rx="1.5" fill="#fff4c2"/>
      <rect x="20" y="3" width="5" height="3" rx="1.5" fill="#fff4c2"/>
      </g>
    </svg>

    <div class="tl-item">
      <span class="tl-node" aria-hidden="true"></span>
      <div class="tl-card">
        <div class="tl-top"><span class="tl-year">1974</span>
          <svg class="tl-ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 19 L7.5 12 Q8.2 10 10.3 10 H19.7 Q21.8 10 22.5 12 L25 19 V24 H5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="11" y="5" width="8" height="4" rx="1" fill="currentColor"/><circle cx="10" cy="24" r="2.6" fill="currentColor"/><circle cx="20" cy="24" r="2.6" fill="currentColor"/></svg>
        </div>
        <p>بداية موثقة في الدراسة لحضور النساء في قيادة سيارات الأجرة.</p>
      </div>
    </div>

    <div class="tl-item">
      <span class="tl-node" aria-hidden="true"></span>
      <div class="tl-card">
        <div class="tl-top"><span class="tl-year">1981</span>
          <svg class="tl-ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 Q17 3 17 6 V12 L27 18 V21 L17 18 V24 L20 26 V28 L15 27 L10 28 V26 L13 24 V18 L3 21 V18 L13 12 V6 Q13 3 15 3 Z" fill="currentColor"/></svg>
        </div>
        <p>التحاق علياء المنشاري بالخطوط التونسية كمساعدة طيار.</p>
      </div>
    </div>

    <div class="tl-item">
      <span class="tl-node" aria-hidden="true"></span>
      <div class="tl-card">
        <div class="tl-top"><span class="tl-year">1990</span>
          <svg class="tl-ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3 Q17 3 17 6 V12 L27 18 V21 L17 18 V24 L20 26 V28 L15 27 L10 28 V26 L13 24 V18 L3 21 V18 L13 12 V6 Q13 3 15 3 Z" fill="currentColor"/></svg>
        </div>
        <p>محطة مهمة في مسيرتها كطيارة.</p>
      </div>
    </div>

    <div class="tl-item">
      <span class="tl-node" aria-hidden="true"></span>
      <div class="tl-card">
        <div class="tl-top"><span class="tl-year">2017</span>
          <svg class="tl-ico" viewBox="0 0 30 30" aria-hidden="true"><rect x="6" y="5" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="8" width="12" height="6" rx="1" fill="currentColor"/><circle cx="11" cy="18.5" r="1.6" fill="currentColor"/><circle cx="19" cy="18.5" r="1.6" fill="currentColor"/><path d="M9 23 L6 28 M21 23 L24 28 M13 2 H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <p>11 سائقة مترو من أصل 219 سائقًا</p>
      </div>
    </div>

    <div class="tl-item">
      <span class="tl-node" aria-hidden="true"></span>
      <div class="tl-card">
        <div class="tl-top"><span class="tl-year">2026</span>
          <svg class="tl-ico" viewBox="0 0 30 30" aria-hidden="true"><rect x="6" y="5" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="8" width="12" height="6" rx="1" fill="currentColor"/><circle cx="11" cy="18.5" r="1.6" fill="currentColor"/><circle cx="19" cy="18.5" r="1.6" fill="currentColor"/><path d="M9 23 L6 28 M21 23 L24 28 M13 2 H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <p>4 سائقات مترو ناشطات وفق تصريح ابتسام النابلي.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var track = document.getElementById('tl-track');
  if (!track) return;
  var car = document.getElementById('tl-car'), trail = document.getElementById('tl-trail');
  var items = track.querySelectorAll('.tl-item'), ticking = false;
  function update(){
    ticking = false;
    var rect = track.getBoundingClientRect(), vh = window.innerHeight || 800;
    var H = track.offsetHeight;
    var y = Math.max(0, Math.min(H, vh * 0.55 - rect.top));
    car.style.top = y + 'px';
    trail.style.height = y + 'px';
    for (var i = 0; i !== items.length; i++){
      var node = items[i].querySelector('.tl-node');
      var ny = items[i].offsetTop + node.offsetTop + 16;
      var d = y - ny;
      if (d === Math.abs(d)) items[i].classList.add('tl-on'); else items[i].classList.remove('tl-on');
    }
  }
  function onScroll(){ if (!ticking){ ticking = true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();
</script>
