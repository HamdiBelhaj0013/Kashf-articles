<style>
.gjc.qp4-root{--qp4-acc:#96A32E;--qp4-ink:#66711A;--qp4-soft:rgba(150,163,46,.26);--qp4-text:#1F1B16;--qp4-muted:#6B6258;--qp4-bg:#FBF7F1;--qp4-step:75ms;--qp4-base:350ms;--qp4-end:2375ms;direction:rtl;text-align:right;max-width:780px;margin:40px auto;padding:0 16px;box-sizing:border-box;font-family:'Almarai',sans-serif}
.gjc.qp4-root *{box-sizing:border-box}
.gjc.qp4-root .qp4-card{position:relative;margin:0;padding:clamp(44px,7.5vw,68px) 0 0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.gjc.qp4-root .qp4-card::before,.gjc.qp4-root .qp4-card::after,.gjc.qp4-root .qp4-text::before,.gjc.qp4-root .qp4-text::after{content:'';display:none !important}
.gjc.qp4-root .qp4-mark{position:absolute;top:0;left:0;width:clamp(54px,9vw,84px);height:auto;fill:var(--qp4-acc);opacity:0;transform:scale(.4) rotate(-14deg);transform-origin:center;transition:opacity .6s ease,transform .8s cubic-bezier(.2,1.4,.4,1)}
.gjc.qp4-root .qp4-text{position:relative;margin:0;padding:0;font-family:'Amiri',serif;font-weight:700;font-size:clamp(21px,3.5vw,31px);line-height:1.95;color:var(--qp4-text);quotes:none;border:0;background:none}
.gjc.qp4-root .qp4-w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.35em);transition:opacity .55s ease,filter .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--qp4-i) * var(--qp4-step) + var(--qp4-base))}
.gjc.qp4-root .qp4-hl{color:var(--qp4-ink);background-image:linear-gradient(var(--qp4-soft),var(--qp4-soft));background-repeat:no-repeat;background-position:100% 88%;background-size:0% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:3px;transition:background-size .9s cubic-bezier(.6,0,.2,1) var(--qp4-end)}
.gjc.qp4-root .qp4-cap{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:clamp(18px,3vw,26px);opacity:0;transform:translateY(8px);transition:opacity .6s ease calc(var(--qp4-end) + 200ms),transform .6s ease calc(var(--qp4-end) + 200ms)}
.gjc.qp4-root .qp4-line{display:block;height:2px;width:0;background:var(--qp4-acc);transition:width .7s ease calc(var(--qp4-end) + 250ms)}
.gjc.qp4-root .qp4-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--qp4-acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;line-height:1}
.gjc.qp4-root .qp4-who{display:flex;flex-direction:column;align-items:flex-end;text-align:left;line-height:1.35}
.gjc.qp4-root .qp4-name{font-weight:800;font-size:16px;color:var(--qp4-text)}
.gjc.qp4-root .qp4-role{font-weight:400;font-size:14px;color:var(--qp4-muted)}
.gjc.qp4-root.qp4-in .qp4-mark{opacity:.16;transform:scale(1) rotate(0)}
.gjc.qp4-root.qp4-in .qp4-w{opacity:1;filter:blur(0);transform:none}
.gjc.qp4-root.qp4-in .qp4-hl{background-size:100% 42%}
.gjc.qp4-root.qp4-in .qp4-cap{opacity:1;transform:none}
.gjc.qp4-root.qp4-in .qp4-line{width:clamp(28px,6vw,56px)}
@media (max-width:480px){.gjc.qp4-root{margin:28px auto}.gjc.qp4-root .qp4-av{width:36px;height:36px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.gjc.qp4-root *{transition:none !important}.gjc.qp4-root .qp4-w{opacity:1;filter:none;transform:none}.gjc.qp4-root .qp4-hl{background-size:100% 42%}.gjc.qp4-root .qp4-cap{opacity:1;transform:none}.gjc.qp4-root .qp4-line{width:40px}.gjc.qp4-root .qp4-mark{opacity:.16;transform:none}}
</style>
<div class="gjc qp4-root" id="qp4-root" dir="rtl" lang="ar">
  <div class="qp4-card" role="figure" aria-label="اقتباس — نسرين بالحاج">
    <svg class="qp4-mark" viewBox="0 0 64 48" aria-hidden="true"><path d="M0 48V28C0 12 8 3 24 0l3 6C18 9 14 15 14 22h10v26H0zm36 0V28c0-16 8-25 24-28l3 6c-9 3-13 9-13 16h10v26H36z"/></svg>
    <p class="qp4-text"><span class="qp4-hl"><span class="qp4-w" style="--qp4-i:0">لا</span> <span class="qp4-w" style="--qp4-i:1">يوجد</span> <span class="qp4-w" style="--qp4-i:2">وقت</span> <span class="qp4-w" style="--qp4-i:3">محدد،</span></span> <span class="qp4-w" style="--qp4-i:4">في</span> <span class="qp4-w" style="--qp4-i:5">أي</span> <span class="qp4-w" style="--qp4-i:6">لحظة</span> <span class="qp4-w" style="--qp4-i:7">يجب</span> <span class="qp4-w" style="--qp4-i:8">أن</span> <span class="qp4-w" style="--qp4-i:9">تكوني</span> <span class="qp4-w" style="--qp4-i:10">حاضرة</span> <span class="qp4-w" style="--qp4-i:11">لتبريدهم</span> <span class="qp4-w" style="--qp4-i:12">وتقديم</span> <span class="qp4-w" style="--qp4-i:13">الماء</span> <span class="qp4-w" style="--qp4-i:14">والعلف...</span> <span class="qp4-hl"><span class="qp4-w" style="--qp4-i:15">وأي</span> <span class="qp4-w" style="--qp4-i:16">تقصير</span> <span class="qp4-w" style="--qp4-i:17">يمكن</span> <span class="qp4-w" style="--qp4-i:18">أن</span> <span class="qp4-w" style="--qp4-i:19">يكلف</span> <span class="qp4-w" style="--qp4-i:20">الكثير.</span></span></p>
    <div class="qp4-cap">
      <span class="qp4-who"><span class="qp4-name">نسرين بالحاج</span><span class="qp4-role">فلاحة شابة</span></span>
    </div>
  </div>
</div>
<script>
(function(){
  var r=document.getElementById('qp4-root');
  if(!r){return;}
  var go=function(){r.classList.add('qp4-in');};
  if(!('IntersectionObserver' in window)){go();return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go();io.disconnect();}});},{threshold:0.35});
  io.observe(r);
})();
</script>
