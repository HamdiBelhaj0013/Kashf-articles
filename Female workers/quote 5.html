<style>
#ajhdt5-scene{width:100%;min-height:220px;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:transparent;position:relative;}
#ajhdt5-text{direction:rtl;font-family:'Amiri',Georgia,serif;font-size:24px;line-height:2.4;text-align:center;max-width:680px;color:#222222;position:relative;}
@media(max-width:600px){#ajhdt5-text{font-size:19px;line-height:2.2;}}
.ajhdt5-w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(5px);transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),transform 0.55s cubic-bezier(0.22,1,0.36,1),filter 0.55s cubic-bezier(0.22,1,0.36,1);color:#222222;font-weight:400;white-space:nowrap;text-decoration:none;}
.ajhdt5-w.on{opacity:1;transform:translateY(0);filter:blur(0);}
.ajhdt5-k{color:#E8650A;font-weight:700;}
.ajhdt5-k.on{animation:ajhdt5-pop 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes ajhdt5-pop{0%{opacity:0;transform:translateY(14px) scale(0.88);filter:blur(6px);color:#006eff;}60%{opacity:1;transform:translateY(-4px) scale(1.07);filter:blur(0);color:#006eff;}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);color:#006eff;}}
.ajhdt5-sp{display:inline-block;width:0.3em;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<div id="ajhdt5-scene">
  <div id="ajhdt5-text"></div>
</div>

<script>
(function(){
  var W=[
    {t:"لم",k:false},{t:"ولن",k:false},{t:"أنسى",k:true},{t:"طوال",k:false},
    {t:"حياتي",k:false},{t:"تلك",k:false},{t:"الابتسامة",k:true},{t:"التي",k:false},
    {t:"ارتسمت",k:false},{t:"على",k:false},{t:"وجهها",k:false},{t:"وهي",k:false},
    {t:"تشجّعني",k:true},{t:"على",k:false},{t:"إنهاء",k:true},{t:"حملي..",k:true},
    {t:"في",k:false},{t:"وقت",k:false},{t:"كنت",k:false},{t:"فيه",k:false},
    {t:"أحوج",k:true},{t:"ما",k:false},{t:"أكون",k:false},{t:"إلى",k:false},
    {t:"القليل",k:false},{t:"فقط",k:false},{t:"من",k:false},{t:"الدعم",k:true},
    {t:"والاحتواء",k:true}
  ];

  var box=document.getElementById("ajhdt5-text");
  var scene=document.getElementById("ajhdt5-scene");
  var played=false;

  function play(){
    if(played)return;
    played=true;
    W.forEach(function(w,i){
      var s=document.createElement("span");
      s.className=w.k?"ajhdt5-w ajhdt5-k":"ajhdt5-w";
      s.textContent=w.t;
      box.appendChild(s);
      if(i<W.length-1){var sp=document.createElement("span");sp.className="ajhdt5-sp";box.appendChild(sp);}
    });
    var els=box.querySelectorAll(".ajhdt5-w");
    els.forEach(function(el,i){
      setTimeout(function(){el.classList.add("on");},i*145+80);
    });
  }

  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting){play();io.disconnect();}
    },{threshold:0.2,rootMargin:"0px 0px -60px 0px"});
    io.observe(scene);
  } else {
    play();
  }
})();
</script>
