<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنواع المبيدات الزراعية — بطاقات</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  #fcp-wrap{
    --fcp-green:#958460;
    --fcp-green-dark:#6b5a3d;
    --fcp-green-soft:#f1ece2;
    --fcp-orange:#B27955;
    --fcp-ink:#1c1a17;
    --fcp-sub:#6b6459;
    --fcp-line:#e7e1d8;
    --fcp-bg:#faf8f4;
    font-family:'Almarai',sans-serif; direction:rtl; color:var(--fcp-ink);
    max-width:960px; margin:0 auto; padding:32px 16px;
  }
  #fcp-wrap *{box-sizing:border-box;}

  .fcp-head{text-align:center; margin-bottom:34px;}
  .fcp-head .fcp-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.09em;
    color:var(--fcp-green); text-transform:uppercase; margin-bottom:10px;
  }
  .fcp-head .fcp-eyebrow::before,.fcp-head .fcp-eyebrow::after{content:"";width:20px;height:2px;background:var(--fcp-green);}
  .fcp-head h2{font-size:24px; margin:0 0 8px; font-weight:800;}
  .fcp-head p{color:var(--fcp-sub); font-size:14px; margin:0; line-height:1.8;}

  .fcp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .fcp-card{
    perspective:1400px; height:230px; cursor:pointer;
    opacity:0; transform:translateY(20px) scale(.97);
    transition:opacity .55s ease, transform .55s ease;
  }
  .fcp-card.fcp-in{opacity:1; transform:translateY(0) scale(1);}
  .fcp-inner{
    position:relative; width:100%; height:100%;
    transition:transform .65s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .fcp-card.flipped .fcp-inner{transform:rotateY(180deg);}

  .fcp-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    padding:22px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; gap:12px;
  }
  .fcp-front{
    background:#fff; border:1px solid var(--fcp-line);
    box-shadow:0 2px 10px rgba(60,50,35,.06);
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  .fcp-card:hover .fcp-front{ box-shadow:0 10px 26px rgba(149,132,96,.22); border-color:var(--fcp-green);}
  .fcp-icon-circle{
    width:64px; height:64px; border-radius:50%; background:var(--fcp-green-soft);
    display:flex; align-items:center; justify-content:center; color:var(--fcp-green);
    transition:transform .3s ease;
  }
  .fcp-card:hover .fcp-icon-circle{ transform:scale(1.06); }
  .fcp-icon{width:32px; height:32px;}
  .fcp-icon path,.fcp-icon circle,.fcp-icon line,.fcp-icon ellipse{
    stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round;
  }
  .fcp-front b{font-size:16.5px; font-weight:800; line-height:1.4;}
  .fcp-front span{font-family:'Oswald',sans-serif; font-size:11.5px; color:var(--fcp-sub); letter-spacing:.05em;}
  .fcp-flip-hint{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--fcp-sub); opacity:.6; display:flex; align-items:center; gap:4px;
  }
  .fcp-flip-hint svg{width:11px; height:11px;}

  .fcp-back{
    background:linear-gradient(150deg, var(--fcp-green) 0%, var(--fcp-green-dark) 100%);
    color:#fff; transform:rotateY(180deg);
    box-shadow:0 12px 28px rgba(91,76,49,.3);
  }
  .fcp-back small{
    font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; opacity:.85; margin-bottom:2px;
  }
  .fcp-back b{font-size:15px; line-height:1.65; font-weight:700;}
  .fcp-back .fcp-ex{
    font-size:13px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
    border-radius:10px; padding:8px 14px; margin-top:4px;
  }

  .fcp-hint-row{text-align:center; margin-top:20px; font-size:12px; color:var(--fcp-sub);}

  @media(max-width:720px){
    .fcp-grid{grid-template-columns:repeat(2,1fr);}
    .fcp-card{height:210px;}
  }
  @media(max-width:460px){
    .fcp-grid{grid-template-columns:1fr;}
    .fcp-card{height:180px;}
  }
</style>
</head>
<body>
<div id="fcp-wrap">
  <div class="fcp-head">
    <div class="fcp-eyebrow">أنواع المبيدات الزراعية</div>
    <h2>أنواع المبيدات الزراعية</h2>
    <p>اضغط على أي بطاقة لمعرفة الآفة المستهدفة وأبرز الأمثلة</p>
  </div>
  <div class="fcp-grid" id="fcpGrid"></div>
  <div class="fcp-hint-row">٦ فئات رئيسية للمبيدات المستخدمة في الزراعة</div>
</div>

<script>
(function(){
  'use strict';

  var ICONS = {
    insect: '<svg class="fcp-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="4" ry="6"/><circle cx="12" cy="5" r="2.2"/><line x1="8" y1="9" x2="3" y2="6"/><line x1="16" y1="9" x2="21" y2="6"/><line x1="7" y1="14" x2="2" y2="13"/><line x1="17" y1="14" x2="22" y2="13"/><line x1="7" y1="18" x2="3" y2="20"/><line x1="17" y1="18" x2="21" y2="20"/></svg>',
    weed: '<svg class="fcp-icon" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 9C12 9 6 9 5 4C10 4 12 9 12 9Z"/><path d="M12 13C12 13 18 13 19 8C14 8 12 13 12 13Z"/><path d="M9 21H15"/></svg>',
    fungus: '<svg class="fcp-icon" viewBox="0 0 24 24"><path d="M4 11C4 6.5 7.5 3 12 3C16.5 3 20 6.5 20 11C20 12.5 18.5 13.5 17 13H7C5.5 13.5 4 12.5 4 11Z"/><line x1="12" y1="13" x2="12" y2="20"/><path d="M9 20H15"/></svg>',
    rodent: '<svg class="fcp-icon" viewBox="0 0 24 24"><ellipse cx="10" cy="13" rx="7" ry="5"/><circle cx="17" cy="10" r="2.4"/><circle cx="18" cy="9.3" r=".4" fill="currentColor"/><path d="M4 13C2 13 1 15 1 17"/><path d="M9 18L8 22"/><path d="M13 18L14 22"/><line x1="14.5" y1="8" x2="18" y2="5"/></svg>',
    mite: '<svg class="fcp-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="4.5" ry="5"/><line x1="9" y1="9" x2="4" y2="6"/><line x1="9" y1="11" x2="3" y2="10"/><line x1="9" y1="14" x2="4" y2="16"/><line x1="15" y1="9" x2="20" y2="6"/><line x1="15" y1="11" x2="21" y2="10"/><line x1="15" y1="14" x2="20" y2="16"/></svg>',
    nematode: '<svg class="fcp-icon" viewBox="0 0 24 24"><path d="M4 6C7 6 6 10 9 10C12 10 11 6 14 6C17 6 16 10 19 10"/><path d="M4 14C7 14 6 18 9 18C12 18 11 14 14 14C17 14 16 18 19 18"/></svg>'
  };

  var DATA = [
    {icon:'insect',   name:'مبيدات الحشرات',  en:'INSECTICIDES', target:'الحشرات الضارة بالمحاصيل',  ex:'كلوروبيريفوس، ملاثيون'},
    {icon:'weed',     name:'مبيدات الأعشاب',  en:'HERBICIDES',   target:'الأعشاب والنباتات الطفيلية', ex:'غليفوسات، أتازين'},
    {icon:'fungus',   name:'مبيدات الفطريات', en:'FUNGICIDES',   target:'الأمراض الفطرية النباتية',   ex:'بنزيميدازول، مانكوزيب'},
    {icon:'rodent',   name:'مبيدات القوارض',  en:'RODENTICIDES', target:'الفئران والقوارض',           ex:'بروديفاكوم'},
    {icon:'mite',     name:'مبيدات الحلم',    en:'ACARICIDES',   target:'العناكب',                     ex:'أباميكتين'},
    {icon:'nematode', name:'مبيدات الديدان',  en:'NEMATICIDES',  target:'الديدان الخيطية في التربة',   ex:'ميثيل بروميد'}
  ];

  var flipIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14.9-3.9M4 14a8 8 0 0 0 14.9 3.9"/></svg>';

  var grid = document.getElementById('fcpGrid');
  DATA.forEach(function(d){
    var card = document.createElement('div');
    card.className = 'fcp-card';
    card.innerHTML =
      '<div class="fcp-inner">'+
        '<div class="fcp-face fcp-front">'+
          '<div class="fcp-icon-circle">'+ICONS[d.icon]+'</div>'+
          '<b>'+d.name+'</b><span>'+d.en+'</span>'+
          '<div class="fcp-flip-hint">'+flipIcon+' اضغط للقلب</div>'+
        '</div>'+
        '<div class="fcp-face fcp-back">'+
          '<small>الآفة المستهدفة</small>'+
          '<b>'+d.target+'</b>'+
          '<div class="fcp-ex">'+d.ex+'</div>'+
        '</div>'+
      '</div>';
    card.addEventListener('click', function(){ card.classList.toggle('flipped'); });
    grid.appendChild(card);
  });

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var el = entry.target;
        var i = Array.prototype.indexOf.call(el.parentNode.children, el);
        setTimeout(function(){ el.classList.add('fcp-in'); }, i * 90);
        io.unobserve(el);
      }
    });
  }, {threshold:0.2});
  document.querySelectorAll('.fcp-card').forEach(function(el){ io.observe(el); });
})();
</script>
</body>
</html>
