<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Fill Animation</title>
  <style>
    svg {
      width: 180px;
      height: 85px;
      display: block;
      margin: 50px auto;
    }

path {
  fill: #000;
  animation: fillChange 2s ease-in-out forwards;
}

@keyframes fillChange {
  from { fill: #000; transform: scale(0.9); opacity: 0; }
  to { fill: #EE2020; transform: scale(1); opacity: 1; }
}
